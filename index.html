<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Searching Center Student Edition</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: white;
}

/* NAV */
header {
    display: flex;
    justify-content: space-between;
    padding: 20px;
    font-weight: bold;
}

nav a {
    margin-left: 15px;
    color: #93c5fd;
    text-decoration: none;
}

/* HERO */
.hero {
    padding: 50px;
}

.hero h1 {
    font-size: 40px;
}

.search-box {
    margin-top: 20px;
}

.search-box input {
    padding: 10px;
    width: 250px;
    border-radius: 10px;
    border: none;
}

.search-box button {
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #3b82f6;
    color: white;
}

/* CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    padding: 40px;
}

.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 15px;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<header>
    <div>🔍 Searching Center</div>
    <nav>
        <a href="#">Subjects</a>
        <a href="#">Tools</a>
        <a href="#">Highlights</a>
    </nav>
</header>

<section class="hero">
    <h1>Find your next lesson, tool, or idea.</h1>
    <p>Everything in one place.</p>

    <div class="search-box">
        <input placeholder="Search...">
        <button>Search</button>
    </div>
</section>

<section class="cards">
    <div class="card">📘 Math</div>
    <div class="card">🧠 Language Arts</div>
    <div class="card">🌍 Social Studies</div>
    <div class="card">🧰 Google Tools</div>
</section>

</body>
</html>
