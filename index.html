<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Searching Center Student Edition</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
}

/* HEADER */
header {
    padding: 20px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
}

/* SEARCH BAR */
.search-box {
    display: flex;
    justify-content: center;
    margin: 20px;
}

.search-box input {
    width: 60%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

/* NAV */
nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 20px;
}

nav button {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #334155;
    color: white;
    cursor: pointer;
}

nav button:hover {
    background: #475569;
}

/* CARDS */
.container {
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 15px;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.02);
}

/* SUBJECT GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
}

.subject {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
}

.subject:hover {
    background: #334155;
}
</style>

</head>

<body>

<header>
🔎 Searching Center Student Edition
</header>

<div class="search-box">
<input type="text" placeholder="Search anything...">
</div>

<nav>
<button>Home</button>
<button>Homework</button>
<button>Schedule</button>
</nav>

<div class="container">

<div class="card">
<h2>Welcome</h2>
<p>This is your upgraded student portal 🚀</p>
</div>

<div class="card">
<h2>Subjects</h2>

<div class="grid">
<div class="subject">Math</div>
<div class="subject">Language Arts</div>
<div class="subject">Social Studies</div>
<div class="subject">Google Tools</div>
</div>

</div>

<div class="card">
<h2>Quick Links</h2>
<button onclick="window.open('https://classroom.google.com')">
Google Classroom
</button>
</div>

<div class="card">
<h2>Homework</h2>
<p>Coming soon...</p>
</div>

</div>

</body>
</html>
